<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body>
<h1>Parking Management System</h1>
<h2>Forgot Password</h2>

<p>Enter your account email and choose where to receive the verification code.</p>

<form method="post" action="api/forgot-password/request">
    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" required>
    <br><br>

    <input type="radio" id="channelEmail" name="channel" value="EMAIL" checked>
    <label for="channelEmail">Send the code to my email</label><br>

    <input type="radio" id="channelSms" name="channel" value="SMS">
    <label for="channelSms">Send the code by SMS to my saved phone number</label>
    <br><br>

    <button type="submit">Send Code</button>
</form>

<p><a href="login.html">Back to login</a></p>
</body>
</html>
